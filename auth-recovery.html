<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>安心教养 · 重设密码</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}
    body{margin:0;background:#f7f3ed;color:#342a22;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif}
    main{max-width:520px;margin:9vh auto;padding:0 18px}
    .card{background:#fff;border:1px solid #eee5da;border-radius:24px;padding:34px 30px;box-shadow:0 16px 45px rgba(81,55,31,.08);text-align:center}
    .brand{display:inline-flex;align-items:center;gap:10px;color:#86431f;font-weight:750;font-size:18px}
    .mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#8c4926;color:#fff;font-size:23px}
    h1{font-size:25px;line-height:1.3;margin:28px 0 10px}p{margin:10px 0;color:#665b51}
    .button{display:inline-flex;justify-content:center;align-items:center;margin:22px 0 4px;min-height:52px;width:100%;border-radius:15px;background:#914820;color:#fff;text-decoration:none;font-weight:700}
    .button[hidden]{display:none !important}.note{font-size:14px;color:#81766c;margin-top:14px}.error{color:#923b32}
    footer{text-align:center;color:#8a8077;font-size:13px;margin:20px 0}
    @media(max-width:480px){main{margin:6vh auto}.card{padding:30px 22px}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-live="polite">
      <div class="brand"><span class="mark" aria-hidden="true">安</span><span>安心教养 <span style="font-weight:500">Anxin Parenting</span></span></div>
      <h1 id="title">正在准备密码重设…</h1>
      <p id="message">请稍候片刻。</p>
      <a class="button" id="open-app" href="#" hidden>返回安心教养设置新密码</a>
      <p class="note" id="note"></p>
    </section>
    <footer>安心教养 · 陪伴每个家庭一起成长</footer>
  </main>
  <script>
    (function(){
      var params=new URLSearchParams(window.location.search);
      var title=document.getElementById('title'),message=document.getElementById('message');
      var note=document.getElementById('note'),button=document.getElementById('open-app');
      var code=params.get('code'),error=params.get('error_code')||params.get('error');
      var isIos=/iPhone|iPad|iPod/i.test(navigator.userAgent)||
        (/Macintosh/i.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
      if(error){
        var expired=error==='otp_expired'||error==='access_denied';
        title.textContent=expired?'重设密码链接已过期':'暂时无法重设密码';
        message.textContent='请回到安心教养 app，重新发送密码重设邮件，然后尽快打开新邮件。';
        note.className='note error';note.textContent='如果您没有申请重设密码，可以忽略这封邮件。';return;
      }
      if(!code){
        title.textContent='没有找到重设信息';
        message.textContent='请从最新一封安心教养密码重设邮件中的按钮打开此页面。';
        note.textContent='旧邮件中的链接可能已经失效。';return;
      }
      title.textContent='继续重设密码';
      message.textContent='请在发起重设请求的 iPhone 上继续，以安全地验证您的账户。';
      if(isIos){
        button.href='com.tsct.anxinparent://auth-callback?code='+encodeURIComponent(code);
        button.hidden=false;note.textContent='点按按钮返回 app，然后输入并保存新密码。';
      }else{
        note.textContent='为了保护账户，这个链接不能在电脑浏览器中完成。请回到 iPhone app 重新发送一封密码重设邮件，并在同一台手机上打开。';
      }
    })();
  </script>
</body>
</html>
